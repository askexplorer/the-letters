        fill="none" stroke="#A08F69" stroke-width="4"/>
  <path d="M15 22 L32 35 L49 22"
        fill="none" stroke="#A08F69" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
